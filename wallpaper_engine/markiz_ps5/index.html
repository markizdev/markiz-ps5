<!doctype html>
<!-- Живые обои MARKIZ PS5 для Wallpaper Engine: синий фон, плавные световые волны и всплывающие огоньки.
     Всё неподвижное (фон, свечение, затемнение по краям, сам огонёк) рисуется один раз в запасные холсты,
     в каждом кадре только копируется — так обои почти не нагружают видеокарту. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#01051a}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha: false});
let W, H, dots = [], bgC, vigC;
const dotC = document.createElement('canvas');  // один мягкий огонёк 64x64, дальше только масштабируется
(function () {
  dotC.width = dotC.height = 64; const x = dotC.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(170,210,255,1)'); g.addColorStop(1, 'rgba(170,210,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
})();
function layer(draw) { const c = document.createElement('canvas'); c.width = W; c.height = H; draw(c.getContext('2d')); return c; }
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  bgC = layer(x => {
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0a1f5c'); g.addColorStop(.5, '#05103a'); g.addColorStop(1, '#01051a');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const r1 = x.createRadialGradient(W * .2, H * .3, 0, W * .2, H * .3, W * .6);
    r1.addColorStop(0, 'rgba(47,107,255,.5)'); r1.addColorStop(1, 'rgba(47,107,255,0)');
    x.fillStyle = r1; x.fillRect(0, 0, W, H);
    const r2 = x.createRadialGradient(W * .85, H * .8, 0, W * .85, H * .8, W * .5);
    r2.addColorStop(0, 'rgba(0,183,255,.22)'); r2.addColorStop(1, 'rgba(0,183,255,0)');
    x.fillStyle = r2; x.fillRect(0, 0, W, H);
  });
  vigC = layer(x => {
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,.4)'); g.addColorStop(.3, 'rgba(0,0,0,0)');
    g.addColorStop(.85, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  });
  dots = Array.from({length: 110}, () => newDot(true));
}
function newDot(any) {
  const r = [1.5, 2, 3, 4, 6, 9, 13][Math.random() * 7 | 0];
  return {x: Math.random() * W, y: any ? Math.random() * H : H + 20, r,
          v: .15 + Math.random() * .45, a: .05 + Math.random() * .3, ph: Math.random() * 6.28};
}
function waves(t) {
  ctx.globalCompositeOperation = 'lighter';
  const step = Math.max(24, W / 90 | 0);  // точек на линию — около 90, глазу хватает
  ctx.lineWidth = H * .12; ctx.strokeStyle = 'rgba(90,150,255,.06)';
  ctx.beginPath();
  for (let x = 0; x <= W + step; x += step) {
    const y = H * .58 + Math.sin(x / W * 3 + t * .25) * H * .06 + Math.sin(x / W * 7 - t * .15) * H * .02;
    x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  for (let i = 0; i < 24; i++) {
    ctx.lineWidth = 1 + (i % 3) * .5;
    ctx.strokeStyle = `rgba(140,190,255,${.05 + (i % 5) * .025})`;
    ctx.beginPath();
    for (let x = 0; x <= W + step; x += step) {
      const k = x / W;
      const y = H * .58 + Math.sin(k * 3 + t * .25 + i * .052) * H * (.05 + i * .0023)
              + Math.sin(k * 6.5 - t * .18 + i * .1) * H * .025 * (1 - k * .5);
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function particles(t) {
  for (const d of dots) {
    d.y -= d.v; d.x += Math.sin(t * .5 + d.ph) * .15;
    if (d.y < -20) Object.assign(d, newDot(false));
    ctx.globalAlpha = d.a * (.6 + .4 * Math.sin(t * 1.3 + d.ph));
    const s = d.r * 4; ctx.drawImage(dotC, d.x - s / 2, d.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
let last = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  if (ms - last < 40) return;  // 25 кадров в секунду — плавно для медленных волн
  last = ms;
  const t = ms / 1000;
  ctx.drawImage(bgC, 0, 0); waves(t); particles(t); ctx.drawImage(vigC, 0, 0);
}
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
</script></body></html>

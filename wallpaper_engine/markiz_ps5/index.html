<!doctype html>
<!-- Живые обои MARKIZ PS5 для Wallpaper Engine: синий фон, плавные световые волны и всплывающие огоньки -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#01051a}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dots = [];
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  dots = Array.from({length: 120}, () => newDot(true));
}
function newDot(any) {
  const r = [1.5, 2, 3, 4, 6, 9, 13][Math.random() * 7 | 0];
  return {x: Math.random() * W, y: any ? Math.random() * H : H + 20, r,
          v: .15 + Math.random() * .45, a: .05 + Math.random() * .3, ph: Math.random() * 6.28};
}
function bg() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0a1f5c'); g.addColorStop(.5, '#05103a'); g.addColorStop(1, '#01051a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r1 = ctx.createRadialGradient(W * .2, H * .3, 0, W * .2, H * .3, W * .6);
  r1.addColorStop(0, 'rgba(47,107,255,.5)'); r1.addColorStop(1, 'rgba(47,107,255,0)');
  ctx.fillStyle = r1; ctx.fillRect(0, 0, W, H);
  const r2 = ctx.createRadialGradient(W * .85, H * .8, 0, W * .85, H * .8, W * .5);
  r2.addColorStop(0, 'rgba(0,183,255,.22)'); r2.addColorStop(1, 'rgba(0,183,255,0)');
  ctx.fillStyle = r2; ctx.fillRect(0, 0, W, H);
}
function waves(t) {
  ctx.globalCompositeOperation = 'lighter';
  // широкая мягкая полоса света
  ctx.lineWidth = H * .12; ctx.strokeStyle = 'rgba(90,150,255,.06)';
  ctx.beginPath();
  for (let x = 0; x <= W; x += 20) {
    const y = H * .58 + Math.sin(x / W * 3 + t * .25) * H * .06 + Math.sin(x / W * 7 - t * .15) * H * .02;
    x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  // пучок тонких линий
  for (let i = 0; i < 28; i++) {
    ctx.lineWidth = 1 + (i % 3) * .5;
    ctx.strokeStyle = `rgba(140,190,255,${.05 + (i % 5) * .025})`;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 16) {
      const k = x / W;
      const y = H * .58 + Math.sin(k * 3 + t * .25 + i * .045) * H * (.05 + i * .002)
              + Math.sin(k * 6.5 - t * .18 + i * .09) * H * .025 * (1 - k * .5);
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function particles(t) {
  for (const d of dots) {
    d.y -= d.v; d.x += Math.sin(t * .5 + d.ph) * .15;
    if (d.y < -20) Object.assign(d, newDot(false));
    const a = d.a * (.6 + .4 * Math.sin(t * 1.3 + d.ph));
    const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 2);
    g.addColorStop(0, `rgba(170,210,255,${a})`); g.addColorStop(1, 'rgba(170,210,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 2, 0, 6.29); ctx.fill();
  }
}
function vignette() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,.4)'); g.addColorStop(.3, 'rgba(0,0,0,0)');
  g.addColorStop(.85, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
let last = 0;
function frame(ms) {
  requestAnimationFrame(frame);
  if (ms - last < 33) return;  // ~30 кадров в секунду, чтобы не грузить видеокарту
  last = ms;
  const t = ms / 1000;
  bg(); waves(t); particles(t); vignette();
}
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
</script></body></html>
